# buf module config: lint and breaking-change rules for proto/.
version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # AnalyzeLead streams AnalysisEvent; a per-RPC response wrapper adds nothing.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
