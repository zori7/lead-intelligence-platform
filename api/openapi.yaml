openapi: 3.0.3
info:
  title: Lead Intelligence API
  version: 0.1.0
  description: |
    REST API between the browser and the Go service.

    This file is the single source of truth for the HTTP contract. Generated from it:
    - Go types, the chi server interface and the embedded spec (`backend/internal/api`)
    - TypeScript types and zod schemas (`frontend/src/lib/api/gen`)

    Go request validation reads field limits, enums and patterns from the embedded copy
    of this spec, so a constraint changed here applies to the server and the browser alike.
    Run `make openapi` after editing.

    Conventions (SPEC.md §7.1): JSON, snake_case fields, RFC 3339 UTC timestamps, every
    4xx/5xx response uses the `Error` envelope.

servers:
  - url: /api

paths:
  /leads:
    get:
      operationId: listLeads
      summary: List leads
      tags: [leads]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LeadStatus' }
        - name: q
          in: query
          description: Case-insensitive substring match on company or contact name.
          schema: { type: string, maxLength: 200 }
        - name: sort
          in: query
          schema: { $ref: '#/components/schemas/LeadSort' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: A page of leads.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadList' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createLead
      summary: Create a lead
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadCreate' }
      responses:
        '201':
          description: The created lead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lead' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }

  /leads/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: A malformed ID is treated as unknown (404).
        schema: { type: string, format: uuid }
    get:
      operationId: getLead
      summary: Get a lead with its latest analysis
      tags: [leads]
      responses:
        '200':
          description: The lead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateLead
      summary: Partially update a lead
      description: Absent fields are unchanged; `null` clears a nullable field.
      tags: [leads]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadPatch' }
      responses:
        '200':
          description: The updated lead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lead' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
    delete:
      operationId: deleteLead
      summary: Delete a lead
      tags: [leads]
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

  /leads/{id}/analyses:
    parameters:
      - name: id
        in: path
        required: true
        description: A malformed ID is treated as unknown (404).
        schema: { type: string, format: uuid }
    post:
      operationId: triggerAnalysis
      summary: Start an AI analysis of the lead
      description: |
        Idempotent: at most one analysis per lead is active. If one is queued or running,
        it is returned with `200` instead of starting another.
      tags: [analyses]
      responses:
        '202':
          description: A new analysis job was queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisJob' }
        '200':
          description: An analysis is already active for this lead; that job is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisJob' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ai_not_configured`: no default model has been set on the admin page.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: listLeadAnalyses
      summary: Analysis history of a lead, newest first
      tags: [analyses]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: The lead's analyses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisJobList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /analyses/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: A malformed ID is treated as unknown (404).
        schema: { type: string, format: uuid }
    get:
      operationId: getAnalysis
      summary: Get an analysis job
      tags: [analyses]
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisJob' }
        '404': { $ref: '#/components/responses/NotFound' }

  /config:
    get:
      operationId: getConfig
      summary: Public application status for the UI
      tags: [config]
      responses:
        '200':
          description: Application status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppConfig' }

  /admin/llm-settings:
    get:
      operationId: getLlmSettings
      summary: Default and per-step LLM settings with resolved effective values
      tags: [admin]
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: Current settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: putLlmSettings
      summary: Replace all LLM settings
      description: |
        Full replace in one transaction. Every non-null model must be listed by the LLM
        server; the next analysis to be claimed uses the new settings.
      tags: [admin]
      security: [{ adminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LlmSettingsUpdate' }
      responses:
        '200':
          description: The saved settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LlmSettings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422':
          description: '`unknown_model`: a model is not available on the LLM server (`fields` names it).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/LlmUnreachable' }

  /admin/llm-models:
    get:
      operationId: listLlmModels
      summary: Models available on the LLM server
      tags: [admin]
      security: [{ adminToken: [] }]
      responses:
        '200':
          description: Model IDs, sorted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/LlmUnreachable' }

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: The `ADMIN_TOKEN` configured on the server. Required for every `/admin/*` route.

  responses:
    Unauthorized:
      description: '`unauthorized`: missing or wrong admin token.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LlmUnreachable:
      description: '`llm_unreachable`: the LLM server could not be reached.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: '`invalid_json` or `validation_failed` (with per-field messages in `fields`).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`not_found`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: '`payload_too_large` (body over 64 KB).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---- Enums -------------------------------------------------------------
    LeadStatus:
      type: string
      enum: [new, contacted, qualified, proposal, won, lost]
      x-enum-varnames: [StatusNew, StatusContacted, StatusQualified, StatusProposal, StatusWon, StatusLost]
    CompanySize:
      type: string
      enum: ['1-10', '11-50', '51-200', '201-1000', '1000+']
      x-enum-varnames: [Size1To10, Size11To50, Size51To200, Size201To1000, Size1000Plus]
    Tier:
      type: string
      enum: [hot, warm, cold]
      x-enum-varnames: [TierHot, TierWarm, TierCold]
    LeadSort:
      type: string
      enum: [created_desc, score_desc]
      x-enum-varnames: [SortCreatedDesc, SortScoreDesc]
      default: created_desc

    # ---- Field constraints (shared by create, patch and response) ----------
    # Mirrored by DB CHECK constraints in backend/migrations; change both together.
    CompanyName:
      type: string
      minLength: 1
      maxLength: 200
    Website:
      type: string
      nullable: true
      maxLength: 300
      pattern: '^https?://[^\s/?#]+[^\s]*$'
      x-pattern-message: must be a valid http(s) URL
    ContactName:
      type: string
      nullable: true
      maxLength: 200
    ContactEmail:
      type: string
      nullable: true
      maxLength: 320
      pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
      x-pattern-message: must be a valid email address
    ContactTitle:
      type: string
      nullable: true
      maxLength: 200
    Industry:
      type: string
      nullable: true
      maxLength: 100
    Notes:
      type: string
      nullable: true
      maxLength: 5000
      description: Free-form context fed to the AI analysis.
    NullableCompanySize:
      nullable: true
      allOf:
        - $ref: '#/components/schemas/CompanySize'
    NullableTier:
      nullable: true
      allOf:
        - $ref: '#/components/schemas/Tier'

    # ---- Resources -----------------------------------------------------------
    Lead:
      type: object
      additionalProperties: false
      required:
        - id
        - company_name
        - website
        - contact_name
        - contact_email
        - contact_title
        - industry
        - company_size
        - notes
        - status
        - ai_score
        - ai_tier
        - last_analyzed_at
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        company_name: { $ref: '#/components/schemas/CompanyName' }
        website: { $ref: '#/components/schemas/Website' }
        contact_name: { $ref: '#/components/schemas/ContactName' }
        contact_email: { $ref: '#/components/schemas/ContactEmail' }
        contact_title: { $ref: '#/components/schemas/ContactTitle' }
        industry: { $ref: '#/components/schemas/Industry' }
        company_size: { $ref: '#/components/schemas/NullableCompanySize' }
        notes: { $ref: '#/components/schemas/Notes' }
        status: { $ref: '#/components/schemas/LeadStatus' }
        ai_score: { type: integer, minimum: 0, maximum: 100, nullable: true }
        ai_tier: { $ref: '#/components/schemas/NullableTier' }
        last_analyzed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LeadCreate:
      type: object
      additionalProperties: false
      description: Optional text fields are trimmed; an empty string is stored as null.
      required: [company_name]
      properties:
        company_name: { $ref: '#/components/schemas/CompanyName' }
        website: { $ref: '#/components/schemas/Website' }
        contact_name: { $ref: '#/components/schemas/ContactName' }
        contact_email: { $ref: '#/components/schemas/ContactEmail' }
        contact_title: { $ref: '#/components/schemas/ContactTitle' }
        industry: { $ref: '#/components/schemas/Industry' }
        company_size: { $ref: '#/components/schemas/NullableCompanySize' }
        notes: { $ref: '#/components/schemas/Notes' }
        status: { $ref: '#/components/schemas/LeadStatus' }

    LeadPatch:
      type: object
      additionalProperties: false
      description: Absent fields are unchanged; null clears a nullable field.
      properties:
        company_name: { $ref: '#/components/schemas/CompanyName' }
        website: { $ref: '#/components/schemas/Website' }
        contact_name: { $ref: '#/components/schemas/ContactName' }
        contact_email: { $ref: '#/components/schemas/ContactEmail' }
        contact_title: { $ref: '#/components/schemas/ContactTitle' }
        industry: { $ref: '#/components/schemas/Industry' }
        company_size: { $ref: '#/components/schemas/NullableCompanySize' }
        notes: { $ref: '#/components/schemas/Notes' }
        status: { $ref: '#/components/schemas/LeadStatus' }

    LeadList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Lead' }
        total:
          type: integer
          description: Total matching leads, ignoring limit/offset.

    LeadDetail:
      type: object
      additionalProperties: false
      required: [lead, latest_analysis]
      properties:
        lead: { $ref: '#/components/schemas/Lead' }
        latest_analysis:
          nullable: true
          description: The most recent analysis job; null if the lead was never analyzed.
          allOf:
            - $ref: '#/components/schemas/AnalysisJob'

    # ---- Analyses (SPEC.md §7.2) ---------------------------------------------
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
      x-enum-varnames: [JobQueued, JobRunning, JobSucceeded, JobFailed, JobCancelled]
    StepName:
      type: string
      enum:
        - validate_input
        - fetch_website
        - extract_company
        - analyze_fit
        - analyze_intent
        - score_lead
        - generate_recommendations
        - aggregate
      x-enum-varnames:
        - StepValidateInput
        - StepFetchWebsite
        - StepExtractCompany
        - StepAnalyzeFit
        - StepAnalyzeIntent
        - StepScoreLead
        - StepGenerateRecommendations
        - StepAggregate
    StepState:
      type: string
      enum: [pending, running, done, skipped, failed]
      x-enum-varnames: [StepPending, StepRunning, StepDone, StepSkipped, StepFailed]
    LlmNode:
      type: string
      enum: [extract_company, analyze_fit, analyze_intent, generate_recommendations]
      x-enum-varnames: [NodeExtractCompany, NodeAnalyzeFit, NodeAnalyzeIntent, NodeGenerateRecommendations]
    Priority:
      type: string
      enum: [high, medium, low]
      x-enum-varnames: [PriorityHigh, PriorityMedium, PriorityLow]
    WebsiteFetchStatus:
      type: string
      enum: [fetched, not_provided, disabled, blocked, failed]
      x-enum-varnames: [WebsiteFetched, WebsiteNotProvided, WebsiteDisabled, WebsiteBlocked, WebsiteFailed]
      description: |
        `fetched`: page text was used. `not_provided`: lead has no website. `disabled`: website
        fetch is turned off. `blocked`: robots.txt disallows it or the address is not public.
        `failed`: network error, timeout, non-2xx, non-HTML, or no readable text.

    AnalysisStep:
      type: object
      additionalProperties: false
      required: [name, state]
      properties:
        name: { $ref: '#/components/schemas/StepName' }
        state: { $ref: '#/components/schemas/StepState' }

    AnalysisError:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: |
            `invalid_input`, `insufficient_data`, `provider_error`, `provider_config`, `internal`,
            `ai_unavailable`, `timeout`, `interrupted` (SPEC.md §11.1).
        message: { type: string, description: User-safe message. }
        retryable: { type: boolean, description: Whether the UI should offer Retry. }

    AnalysisJob:
      type: object
      additionalProperties: false
      required: [id, lead_id, status, steps, progress, result, error, created_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        lead_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/JobStatus' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/AnalysisStep' }
        progress: { type: integer, minimum: 0, maximum: 100 }
        result:
          nullable: true
          description: Present when the job succeeded.
          allOf:
            - $ref: '#/components/schemas/AnalysisResult'
        error:
          nullable: true
          description: Present when the job failed.
          allOf:
            - $ref: '#/components/schemas/AnalysisError'
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }

    AnalysisJobList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AnalysisJob' }

    AnalysisResult:
      type: object
      additionalProperties: false
      required: [summary, company, fit, intent, score, recommendations, meta]
      properties:
        summary: { type: string }
        company: { $ref: '#/components/schemas/CompanyInsights' }
        fit:
          nullable: true
          description: Null when the fit branch failed (`meta.partial`).
          allOf:
            - $ref: '#/components/schemas/FitAnalysis'
        intent:
          nullable: true
          description: Null when the intent branch failed (`meta.partial`).
          allOf:
            - $ref: '#/components/schemas/IntentAnalysis'
        score: { $ref: '#/components/schemas/LeadScore' }
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/Recommendation' }
        meta: { $ref: '#/components/schemas/ResultMeta' }

    CompanyInsights:
      type: object
      additionalProperties: false
      required: [name, industry, size_estimate, business_model, description, key_needs, confidence]
      properties:
        name: { type: string }
        industry: { type: string }
        size_estimate: { type: string }
        business_model: { type: string }
        description: { type: string }
        key_needs:
          type: array
          items: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }

    FitAnalysis:
      type: object
      additionalProperties: false
      required: [score, rationale, matched_criteria, gaps]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        rationale: { type: string }
        matched_criteria:
          type: array
          items: { type: string }
        gaps:
          type: array
          items: { type: string }

    IntentAnalysis:
      type: object
      additionalProperties: false
      required: [score, rationale, signals]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        rationale: { type: string }
        signals:
          type: array
          items: { type: string }

    LeadScore:
      type: object
      additionalProperties: false
      required: [value, tier, confidence, breakdown]
      properties:
        value: { type: integer, minimum: 0, maximum: 100 }
        tier: { $ref: '#/components/schemas/Tier' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        breakdown:
          type: object
          additionalProperties: false
          required: [fit, intent]
          properties:
            fit: { type: integer, minimum: 0, maximum: 100, nullable: true }
            intent: { type: integer, minimum: 0, maximum: 100, nullable: true }

    Recommendation:
      type: object
      additionalProperties: false
      required: [action, rationale, priority]
      properties:
        action: { type: string }
        rationale: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }

    WebsiteFetch:
      type: object
      additionalProperties: false
      required: [status, final_url]
      properties:
        status: { $ref: '#/components/schemas/WebsiteFetchStatus' }
        final_url:
          type: string
          nullable: true
          description: URL after redirects; null unless `fetched`.

    ResultMeta:
      type: object
      additionalProperties: false
      required: [node_models, website, partial, warnings, duration_ms, input_tokens, output_tokens]
      properties:
        node_models:
          type: object
          description: Model actually used per LLM step, keyed by step name.
          additionalProperties: { type: string }
        website: { $ref: '#/components/schemas/WebsiteFetch' }
        partial: { type: boolean, description: A non-critical step failed; the result is incomplete. }
        warnings:
          type: array
          items: { type: string }
        duration_ms: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }

    # ---- Config and admin (SPEC.md §7.5) ----------------------------------------
    AppConfig:
      type: object
      additionalProperties: false
      required: [ai_configured]
      properties:
        ai_configured:
          type: boolean
          description: False until an admin sets a default model; analyses are blocked until then.

    # Mirrored by DB CHECK constraints in backend/migrations; change both together.
    ModelName:
      type: string
      minLength: 1
      maxLength: 200
    Temperature:
      type: number
      minimum: 0
      maximum: 2

    LlmDefaultSetting:
      type: object
      additionalProperties: false
      required: [model, temperature]
      properties:
        model:
          nullable: true
          description: Null means AI is not configured yet.
          allOf:
            - $ref: '#/components/schemas/ModelName'
        temperature:
          nullable: true
          description: Null means 0.2.
          allOf:
            - $ref: '#/components/schemas/Temperature'

    LlmNodeSetting:
      type: object
      additionalProperties: false
      required: [node, model, temperature, effective_model, effective_temperature]
      properties:
        node: { $ref: '#/components/schemas/LlmNode' }
        model:
          nullable: true
          description: Null inherits the default.
          allOf:
            - $ref: '#/components/schemas/ModelName'
        temperature:
          nullable: true
          description: Null inherits the default.
          allOf:
            - $ref: '#/components/schemas/Temperature'
        effective_model:
          type: string
          nullable: true
          description: Resolved model (read-only); null while AI is not configured.
        effective_temperature: { $ref: '#/components/schemas/Temperature' }

    LlmSettings:
      type: object
      additionalProperties: false
      required: [default, nodes, configured, updated_at]
      properties:
        default: { $ref: '#/components/schemas/LlmDefaultSetting' }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/LlmNodeSetting' }
        configured: { type: boolean }
        updated_at: { type: string, format: date-time }

    LlmDefaultUpdate:
      type: object
      additionalProperties: false
      required: [model, temperature]
      properties:
        model: { $ref: '#/components/schemas/ModelName' }
        temperature:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Temperature'

    LlmNodeUpdate:
      type: object
      additionalProperties: false
      required: [model, temperature]
      properties:
        model:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ModelName'
        temperature:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Temperature'

    LlmSettingsUpdate:
      type: object
      additionalProperties: false
      required: [default, nodes]
      properties:
        default: { $ref: '#/components/schemas/LlmDefaultUpdate' }
        nodes:
          type: object
          additionalProperties: false
          description: All four LLM steps, each exactly once (full replace).
          required: [extract_company, analyze_fit, analyze_intent, generate_recommendations]
          properties:
            extract_company: { $ref: '#/components/schemas/LlmNodeUpdate' }
            analyze_fit: { $ref: '#/components/schemas/LlmNodeUpdate' }
            analyze_intent: { $ref: '#/components/schemas/LlmNodeUpdate' }
            generate_recommendations: { $ref: '#/components/schemas/LlmNodeUpdate' }

    ModelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id: { type: string }

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code, e.g. `validation_failed`, `not_found`.
            message:
              type: string
              description: User-safe message.
            fields:
              type: object
              description: Per-field validation messages keyed by field name.
              additionalProperties: { type: string }
