[project]
name = "lead-ai"
version = "0.1.0"
description = "AI analysis service: LangGraph workflow behind a gRPC API"
requires-python = ">=3.14"
dependencies = [
    "grpcio>=1.85.1",
    "grpcio-health-checking>=1.85.1",
    "protobuf>=7.36.2",
    "langgraph>=1.2.20",
    "langchain-openai>=1.7.4",
    "langchain-core>=1.7.6",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.85.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]
markers = ["recorded: runs over locally recorded real-site fixtures (skipped when none exist)"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["src/lead_ai/gen"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
